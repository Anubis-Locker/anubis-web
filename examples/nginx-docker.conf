# nginx config used by docker-compose.yml (upstream = the "web" service).
# Plain HTTP; terminate TLS in front of it or adapt examples/nginx-ssl.conf.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

limit_req_zone $binary_remote_addr zone=anubis_login:10m rate=5r/m;

log_format anubis_noq '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

upstream anubis_web {
  server web:5577;
  keepalive 16;
}

server {
  listen 80 default_server;
  server_name _;

  access_log /var/log/nginx/access.log anubis_noq;
  client_max_body_size 50m;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /api/login {
    limit_req zone=anubis_login burst=5 nodelay;
    proxy_pass http://anubis_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://anubis_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 10s;
  }
}
