# Anubis-Security-Tool web - nginx reverse proxy with TLS (recommended).
# Set in .env: HOST=127.0.0.1 PORT=5577 TRUST_PROXY=1 SERVER=https://term.example.com
# SERVER_SECRET / SERVER_PASS must be set to strong values (ENABLE_AUTH=1).

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

limit_req_zone $binary_remote_addr zone=anubis_login:10m rate=5r/m;

# no query string in logs: websocket auth tokens travel in ?token=
log_format anubis_noq '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

upstream anubis_web {
  server 127.0.0.1:5577;
  keepalive 16;
}

upstream anubis_mcp {
  server 127.0.0.1:30837;
}

server {
  listen 80;
  server_name term.example.com;   # change me
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name term.example.com;   # change me

  ssl_certificate     /etc/letsencrypt/live/term.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/term.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  keepalive_timeout 75s;

  access_log /var/log/nginx/anubis-web.access.log anubis_noq;
  client_max_body_size 50m;

  server_tokens off;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /api/login {
    limit_req zone=anubis_login burst=5 nodelay;
    proxy_pass http://anubis_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://anubis_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 10s;
  }

  # Optional MCP endpoint, disabled by default (see nginx.conf).
  # location /mcp {
  #   allow 203.0.113.10;
  #   deny all;
  #   proxy_pass http://anubis_mcp;
  #   proxy_http_version 1.1;
  #   proxy_set_header Connection "";
  #   proxy_set_header Host $host;
  #   proxy_buffering off;
  #   proxy_read_timeout 3600s;
  # }
}
