# Anubis-Security-Tool web - nginx reverse proxy (plain HTTP).
# Use nginx-ssl.conf for anything reachable from the internet.
# Set in .env: HOST=127.0.0.1 PORT=5577 TRUST_PROXY=1 SERVER=http://term.example.com

# http{}-level directives (put in nginx.conf http block or conf.d file)
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# 5 login attempts / minute / ip on top of the in-app limiter
limit_req_zone $binary_remote_addr zone=anubis_login:10m rate=5r/m;

# do not write ?token=... (websocket auth) to the access log
log_format anubis_noq '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_user_agent"';

upstream anubis_web {
  server 127.0.0.1:5577;
  keepalive 16;
}

# optional MCP widget (loopback only, bearer token required, MCP_TOKEN)
upstream anubis_mcp {
  server 127.0.0.1:30837;
}

server {
  listen 80;
  server_name term.example.com;   # change me

  access_log /var/log/nginx/anubis-web.access.log anubis_noq;
  client_max_body_size 50m;       # /api/upload

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /api/login {
    limit_req zone=anubis_login burst=5 nodelay;
    proxy_pass http://anubis_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://anubis_web;
    proxy_http_version 1.1;
    # WebSocket upgrade (ssh/sftp/rdp/vnc/spice/common channels)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 86400s;    # long lived terminals
    proxy_send_timeout 86400s;
    proxy_connect_timeout 10s;
  }

  # Optional MCP endpoint, disabled by default. Uncomment, set your own
  # trusted IP, and keep the bearer token (MCP_TOKEN) enabled.
  # location /mcp {
  #   allow 203.0.113.10;
  #   deny all;
  #   proxy_pass http://anubis_mcp;
  #   proxy_http_version 1.1;
  #   proxy_set_header Connection "";
  #   proxy_set_header Host $host;
  #   proxy_buffering off;          # SSE
  #   proxy_read_timeout 3600s;
  # }
}
